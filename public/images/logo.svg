<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16a34a" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Connection Ring Nodes -->
  <g stroke="url(#nodeGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="130" y1="200" x2="200" y2="150" />
    <line x1="200" y1="150" x2="240" y2="190" />
    <line x1="130" y1="200" x2="160" y2="280" />
    <line x1="160" y1="280" x2="120" y2="330" />

    <line x1="370" y1="220" x2="330" y2="290" />
    <line x1="330" y1="290" x2="380" y2="340" />
    <line x1="330" y1="290" x2="290" y2="330" />
  </g>

  <!-- Network Dots -->
  <circle cx="130" cy="200" r="10" fill="#2563eb" />
  <circle cx="200" cy="150" r="8" fill="#16a34a" />
  <circle cx="240" cy="190" r="9" fill="#0284c7" />
  <circle cx="160" cy="280" r="11" fill="#2563eb" />
  <circle cx="120" cy="330" r="9" fill="#16a34a" />

  <circle cx="370" cy="220" r="10" fill="#0284c7" />
  <circle cx="330" cy="290" r="12" fill="#16a34a" />
  <circle cx="380" cy="340" r="8" fill="#2563eb" />
  <circle cx="290" cy="330" r="9" fill="#eab308" />

  <!-- Main Sprout Leaf Emblem -->
  <g filter="url(#shadow)">
    <!-- Right Main Leaf -->
    <path d="M250 360 C 230 260 290 140 370 120 C 370 200 330 300 250 360 Z" fill="url(#leafGrad)" />
    <!-- Main Leaf Center Vein -->
    <path d="M250 360 Q 300 240 370 120" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Left Secondary Leaf -->
    <path d="M250 360 C 210 310 150 250 160 190 C 220 190 250 260 250 360 Z" fill="url(#leafGrad)" opacity="0.9" />
    <path d="M250 360 Q 200 260 160 190" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Stem Curve -->
    <path d="M250 380 Q 240 330 250 300" fill="none" stroke="#15803d" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
